name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: macos-14
    # Windows only for now. Set the repository variable RELEASE_ALL_PLATFORMS=true to check
    # macOS again (same switch as the release workflow).
    if: ${{ vars.RELEASE_ALL_PLATFORMS == 'true' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repository check
        run: bun run check

      - name: Build and verify unsigned macOS application
        run: bun run package:verify

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Knowledge Bases use node:sqlite, which vitest needs from the runner's Node (24 LTS).
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      # GitHub's release downloads (the Electron zip) sometimes answer 504 for a few minutes.
      - name: Install dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            bun install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Install attempt $attempt failed; trying again in 60 s."
            Start-Sleep -Seconds 60
          }
          exit 1

      - name: Run Windows checks
        run: bun run check

      - name: Build and verify unsigned Windows application
        run: bun run package:win:verify

  compatibility:
    name: Compatibility (${{ matrix.os }})
    # Windows only for now. Set the repository variable RELEASE_ALL_PLATFORMS=true to check
    # macOS again (same switch as the release workflow).
    if: ${{ vars.RELEASE_ALL_PLATFORMS == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repository check
        run: bun run check
