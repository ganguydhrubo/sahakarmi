name: Upstream Radar Watcher

on:
  schedule:
    - cron: '0 4 * * *' # Every day at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Upstream Radar Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-upstream.mjs

      - name: Commit Radar changes if any
        run: |
          git config user.name "Sahkarmi Radar Bot"
          git config user.email "radar@sahkarmi.site"
          git add docs/upstream/RADAR.md
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(upstream): update upstream radar with latest releases"
            git push origin main
          else
            echo "No changes in upstream radar."
          fi
