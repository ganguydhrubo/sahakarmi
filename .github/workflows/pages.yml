name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "scripts/check-website.mjs", "scripts/inject-downloads.mjs", "scripts/inject-notify.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release whose installer the download buttons must point at (release.yml passes its tag)"
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy website to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bake direct installer links into the page, so download buttons never depend on a
      # visitor-side GitHub API call (anonymous calls are rate-limited per IP).
      - name: Point download buttons at the latest installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/inject-downloads.mjs

      # Optional: mail the owner on each Download click (repository variable, public URL).
      - name: Turn on download click mail
        env:
          DOWNLOAD_NOTIFY_URL: ${{ vars.DOWNLOAD_NOTIFY_URL }}
        run: node scripts/inject-notify.mjs

      - name: Check website files (SEO, structured data, links, translations)
        run: node scripts/check-website.mjs

      - name: Stamp the deployed commit
        run: echo "${GITHUB_SHA}" > website/build.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live site
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub Pages caches for up to 10 minutes; wait until this commit is served.
      - name: Check https://sahkarmi.site
        run: node scripts/check-website.mjs --live https://sahkarmi.site/ --expect-build "${GITHUB_SHA}" --retries 36

      # IndexNow tells Bing (and other IndexNow engines) the page changed. The key file is public by design.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"sahkarmi.site","key":"6e6727cb6c8c260da983dc72a7515153","keyLocation":"https://sahkarmi.site/6e6727cb6c8c260da983dc72a7515153.txt","urlList":["https://sahkarmi.site/","https://sahkarmi.site/llms.txt"]}'
