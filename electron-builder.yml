appId: in.sahkarmi.desktop
productName: Sahkarmi
asar: true
# Claude Code ships with the Claude Agent SDK as a native binary; it must sit outside the
# asar archive to be executable.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
artifactName: ${productName}-${version}-${arch}.${ext}
electronUpdaterCompatibility: ">=2.16"
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish:
  provider: github
  owner: ganguydhrubo
  repo: sahakarmi
files:
  - out/**/*
  - package.json
  - LICENSE
  - NOTICE
extraResources:
  - from: node_modules/electron/dist/LICENSE
    to: licenses/Electron-LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
  # Bundled OpenCode (MIT): free, no-login models. Fetched by `bun run fetch:opencode`.
  - from: build/opencode/${os}-${arch}
    to: bin
  - from: resources/licenses
    to: licenses
directories:
  output: dist
mac:
  category: public.app-category.productivity
  minimumSystemVersion: "12.0"
  notarize: true
  hardenedRuntime: true
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  darkModeSupport: true
  extendInfo:
    NSMicrophoneUsageDescription: Sahkarmi records voice notes for your coworkers only when you press record.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  icon: build/icon.ico
  # Windows builds are intentionally unsigned until release signing is configured.
  signExecutable: false
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
linux:
  icon: build/icons
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
dmg:
  title: ${productName} ${version}
  backgroundColor: "#0F1220"
  contents:
    - x: 145
      y: 180
    - x: 395
      y: 180
      type: link
      path: /Applications
